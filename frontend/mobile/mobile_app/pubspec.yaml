name: mobile_app
description: "Collab Workspace — Real-time collaboration app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.6.0
  web_socket_channel: ^3.0.1
  dio: ^5.7.0

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.1

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1

  # Rich text editor
  flutter_quill: ^11.5.0

  # Media
  image_picker: ^1.0.4
  file_picker: ^8.1.2

  # Notifications
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # WebRTC
  flutter_webrtc: ^0.11.7

  # Utils
  intl: ^0.20.2
  timeago: ^3.7.0
  crypto: ^3.0.3
  smooth_page_indicator: ^2.0.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  glados: ^1.1.7

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo.png
    - assets/images/
