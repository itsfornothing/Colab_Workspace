 
# ---- HTTP: health check only, then redirect ----
server {
    listen 80;
 
    # BUG FIX 1: health check on port 80 without redirect
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
 
    location / {
        return 301 https://$host$request_uri;
    }
}
 
# ---- HTTPS: main gateway ----
server {
    listen 443 ssl http2;
 
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
 
    include /etc/nginx/conf.d/security.conf;
 
    # ---- Health check (no auth) ----
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
 
    # ---- Auth endpoints: NO auth_request (they are the auth!) ----
    location /api/auth/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://user_service;
        include proxy_params;
    }
 
    # ---- User / Profile (protected) ----
    location /api/users/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /auth;
        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_email $upstream_http_x_user_email;
        auth_request_set $x_user_role  $upstream_http_x_user_role;
        auth_request_set $x_workspace  $upstream_http_x_workspace_id;
        proxy_set_header X-User-ID       $x_user_id;
        proxy_set_header X-User-Email    $x_user_email;
        proxy_set_header X-User-Role     $x_user_role;
        proxy_set_header X-Workspace-ID  $x_workspace;
        proxy_pass http://user_service;
        include proxy_params;
    }
 
    # ---- Workspace (protected) ----
    location /api/workspaces/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=api_limit burst=30 nodelay;
        auth_request /auth;
        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_email $upstream_http_x_user_email;
        auth_request_set $x_user_role  $upstream_http_x_user_role;
        auth_request_set $x_workspace  $upstream_http_x_workspace_id;
        proxy_set_header X-User-ID       $x_user_id;
        proxy_set_header X-User-Email    $x_user_email;
        proxy_set_header X-User-Role     $x_user_role;
        proxy_set_header X-Workspace-ID  $x_workspace;
        proxy_pass http://workspace_service;
        include proxy_params;
    }
 
    # ---- Chat (protected) ----
    location /api/chat/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=api_limit burst=50 nodelay;
        auth_request /auth;
        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_email $upstream_http_x_user_email;
        proxy_set_header X-User-ID    $x_user_id;
        proxy_set_header X-User-Email $x_user_email;
        proxy_pass http://chat_service;
        include proxy_params;
    }
 
    # ---- Collaboration (protected) ----
    location /api/docs/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=api_limit burst=20 nodelay;
        auth_request /auth;
        auth_request_set $x_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-ID $x_user_id;
        proxy_pass http://collaboration_service;
        include proxy_params;
    }
 
    # ---- Notifications (protected) ----
    location /api/notifications/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=api_limit burst=20 nodelay;
        auth_request /auth;
        auth_request_set $x_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-ID $x_user_id;
        proxy_pass http://notification_service;
        include proxy_params;
    }
 
    # ---- Media / WebRTC (protected) ----
    location /api/media/ {
        include /etc/nginx/conf.d/cors.conf;
        limit_req zone=api_limit burst=20 nodelay;
        auth_request /auth;
        auth_request_set $x_user_id $upstream_http_x_user_id;
        proxy_set_header X-User-ID $x_user_id;
        # Larger body for recording chunk uploads
        client_max_body_size 100m;
        proxy_pass http://media_service;
        include proxy_params;
    }
 
    # ---- Auth validation subrequest (internal only) ----
    location = /auth {
        internal;
        proxy_pass              http://auth_service/api/auth/validate/;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length   "";
        proxy_set_header        X-Original-URI   $request_uri;
        proxy_set_header        X-Original-Method $request_method;
        proxy_set_header        Authorization    $http_authorization;
        # Cache validate responses for 30s (reduces auth_service load ~90%)
        proxy_cache             auth_cache;
        proxy_cache_valid       200 30s;
        proxy_cache_key         $http_authorization;
        proxy_ignore_headers    Cache-Control Expires;
    }
 
    # ---- WebSockets ----
    include /etc/nginx/conf.d/websocket.conf;
 
    # ---- SPA Frontend ----
    include /etc/nginx/conf.d/frontend.conf;
}