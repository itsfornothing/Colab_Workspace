# Set in nginx.conf or via env substitution (envsubst in entrypoint)
# Fallback shown here — replace with your actual domain.
set $cors_origin "https://app.yourapp.com";
 
# Allow the specific requesting origin (supports credentials)
add_header Access-Control-Allow-Origin      $cors_origin always;
add_header Access-Control-Allow-Credentials true         always;
add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Workspace-ID, X-Requested-With" always;
add_header Access-Control-Expose-Headers    "X-User-ID, X-User-Email, X-User-Role, X-Workspace-ID" always;
add_header Access-Control-Max-Age           86400 always;  # cache preflight 24h
 
# Handle OPTIONS preflight without hitting upstream services
if ($request_method = OPTIONS) {
    return 204;
}
 