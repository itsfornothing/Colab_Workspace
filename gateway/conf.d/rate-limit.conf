
# General API: 30 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:20m  rate=30r/s;
 
# Auth endpoints: tighter — 5 requests/second per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
 
# WebSocket connections: 5 new connections/second per IP
limit_req_zone $binary_remote_addr zone=ws_limit:10m   rate=5r/s;
 
# File uploads: 2 per second (recording chunks)
limit_req_zone $binary_remote_addr zone=upload_limit:5m rate=2r/s;
 
# Return 429 instead of default 503 when rate limit is hit
limit_req_status 429;
limit_conn_status 429;
 
# Connection limits (simultaneous connections per IP)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
 