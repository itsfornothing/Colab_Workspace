
# ---- Security headers ----
add_header X-Frame-Options           "SAMEORIGIN"              always;
add_header X-Content-Type-Options    "nosniff"                 always;
add_header X-XSS-Protection          "1; mode=block"           always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
 
# ---- Content Security Policy ----
# Adjust script-src/connect-src for your CDN and WS endpoint
add_header Content-Security-Policy
    "default-src 'self'; "
    "script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; "
    "style-src 'self' 'unsafe-inline'; "
    "img-src 'self' data: https://res.cloudinary.com; "
    "connect-src 'self' wss://app.yourapp.com https://app.yourapp.com; "
    "frame-ancestors 'none';"
    always;
 
# ---- Hide Nginx version from error pages and headers ----
server_tokens off;
 
# ---- Prevent clickjacking ----
# (covered by X-Frame-Options above, belt-and-suspenders)
 
# ---- Block common vulnerability scan paths ----
location ~* \.(env|git|htaccess|htpasswd|sql|log|bak|swp)$ {
    return 404;
}
 