# ---- User / Auth Service ----
upstream user_service {
    server user-service:8000;
    keepalive 32;
}
 
# Alias — Nginx auth_request uses this name
upstream auth_service {
    server user-service:8000;
    keepalive 16;
}
 
# ---- Chat Service ----
upstream chat_service {
    least_conn;
    server chat-service:8000;
    # server chat-service-2:8000;  # uncomment for multiple instances
    keepalive 32;
}
 
# ---- Collaboration Service ----
# hash ensures the same document always hits the same server
# (important if CRDT state is held in-process between flushes)
upstream collaboration_service {
    hash $arg_document_id consistent;
    server collaboration-service:8000;
    keepalive 16;
}
 
# ---- Notification Service ----
upstream notification_service {
    server notification-service:8000;
    keepalive 16;
}
 
# ---- Media Service (WebRTC signaling) ----
upstream media_service {
    least_conn;
    server media-service:8000;
    keepalive 16;
}
 
# ---- Workspace Service ----
upstream workspace_service {
    server workspace-service:8000;
    keepalive 32;
}