worker_processes auto;   # One worker per CPU core
worker_rlimit_nofile 65535;
 
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
 
http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
 
    # ---- Performance ----
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    gzip                on;
    gzip_vary           on;
    gzip_types          text/plain application/json application/javascript text/css;
 
    # ---- Buffer tuning (important for WebSocket + file uploads) ----
    client_max_body_size    50m;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;
 
    # ---- Logging ----
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
 
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":"$request_time",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"}';
 
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;
 
    # ---- Caching for upstream auth responses ----
    # Caches /auth/validate/ responses for 30s to reduce load on user_service
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=auth_cache:10m
                     max_size=100m inactive=30s use_temp_path=off;
 
    # ---- Include modular configs ----
    # Only http-context files are globbed here. Server/location fragments
    # (cors.conf, security.conf, websocket.conf, frontend.conf) are pulled in
    # via explicit include directives inside api.conf where their directives
    # are valid (location/set cannot appear at http level).
    include /etc/nginx/conf.d/upstreams.conf;
    include /etc/nginx/conf.d/rate-limit.conf;
    include /etc/nginx/conf.d/api.conf;
}