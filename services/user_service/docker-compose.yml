version: '3.9'

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-service
    env_file:
      - .env.local
    environment:
      # Override database host for Docker Compose networking
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000
    ports:
      - '8000:8000'
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - static:/app/staticfiles

  db:
    image: postgres:16-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: collaboration_user
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 'Haha123@&$'
    ports:
      - '5432:5432'
    volumes:
      - user-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  user-db-data:
  static:
